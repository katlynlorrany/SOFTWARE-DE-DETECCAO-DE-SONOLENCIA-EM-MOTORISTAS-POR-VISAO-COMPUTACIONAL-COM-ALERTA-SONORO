name: safe_gaze_ai
description: Detector de sonolência para motoristas
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera_android_camerax: 0.6.7+2
  camera: 0.11.0+2
  google_mlkit_face_detection: 0.11.0
  sqflite: ^2.3.0
  path: ^1.8.3
  permission_handler: ^11.0.1
  audioplayers: ^5.2.1
  local_auth: ^2.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^4.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "logo.png"

flutter:
  uses-material-design: true